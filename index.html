<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Materials Science Toolkit</title>
    <style>
        :root {
            --bg-color: #f4f4f9;
            --sidebar-bg: #2c3e50;
            --sidebar-hover: #34495e;
            --text-light: #ecf0f1;
            --accent-color: #5988d4;
        }
        
        body {
            margin: 0;
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            height: 100vh;
            background-color: var(--bg-color);
            overflow: hidden;
        }

        .sidebar {
            width: 280px;
            background-color: var(--sidebar-bg);
            color: var(--text-light);
            display: flex;
            flex-direction: column;
            box-shadow: 2px 0 10px rgba(0,0,0,0.1);
            z-index: 10;
        }

        .sidebar-header {
            padding: 2rem 1.5rem;
            background-color: rgba(0,0,0,0.1);
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .sidebar-header h1 {
            margin: 0;
            font-size: 1.5rem;
            color: #fff;
        }

        .nav-links {
            display: flex;
            flex-direction: column;
            padding: 1rem 0;
            flex: 1;
            overflow-y: auto; /* Allows scrolling if you add many tools */
        }

        .nav-btn {
            background: none;
            border: none;
            color: #bdc3c7;
            padding: 1rem 1.5rem;
            text-align: left;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.2s ease;
            border-left: 4px solid transparent;
        }

        .nav-btn:hover {
            background-color: var(--sidebar-hover);
            color: #fff;
        }

        .nav-btn.active {
            background-color: var(--sidebar-hover);
            color: #fff;
            border-left-color: var(--accent-color);
            font-weight: bold;
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: var(--bg-color);
        }

        #tool-frame {
            width: 100%;
            height: 100%;
            border: none;
            background-color: transparent;
        }
    </style>
</head>
<body>

    <nav class="sidebar">
        <div class="sidebar-header">
            <h1>Materials Toolkit</h1>
        </div>
        <!-- Buttons are intentionally left empty. JS will populate this. -->
        <div class="nav-links" id="nav-container"></div>
    </nav>

    <main class="main-content">
        <iframe id="tool-frame" title="Calculator Display"></iframe>
    </main>

    <script>
        // ==========================================
        // CONFIGURATION: ADD NEW CALCULATORS HERE
        // ==========================================
        const tools = {
            'sol-gel': { title: 'Sol-Gel Calculator', file: '3.html' },
            'tolerance': { title: 'Tolerance Factor', file: '4.html' }
            // 'xrd': { title: 'XRD Peak Analyzer', file: 'xrd-calc.html' } <-- Future example
        };

        // Automatically set the first item in the object as the default
        const defaultTool = Object.keys(tools)[0]; 

        // ==========================================
        // ROUTING & UI LOGIC (No need to touch this)
        // ==========================================

        // 1. Generate the sidebar buttons dynamically
        function buildNavigation() {
            const navContainer = document.getElementById('nav-container');
            
            for (const [id, config] of Object.entries(tools)) {
                const btn = document.createElement('button');
                btn.className = 'nav-btn';
                btn.setAttribute('data-tool', id);
                btn.textContent = config.title;
                btn.onclick = () => navigate(id);
                navContainer.appendChild(btn);
            }
        }

        // 2. Handle URL hash changes and iframe loading
        function loadToolFromHash() {
            let currentHash = window.location.hash.substring(1);
            
            // Fallback to default if hash is empty or invalid
            if (!tools[currentHash]) {
                currentHash = defaultTool;
            }

            // Load the corresponding HTML file into the iframe
            document.getElementById('tool-frame').src = tools[currentHash].file;

            // Highlight the active button
            const buttons = document.querySelectorAll('.nav-btn');
            buttons.forEach(btn => {
                if (btn.getAttribute('data-tool') === currentHash) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });
        }

        // 3. Update the URL hash when a button is clicked
        function navigate(toolId) {
            window.location.hash = toolId;
        }

        // Initialize everything when the DOM is ready
        window.addEventListener('DOMContentLoaded', () => {
            buildNavigation();
            loadToolFromHash();
        });
        
        // Listen for browser back/forward navigation
        window.addEventListener('hashchange', loadToolFromHash);
    </script>

</body>
</html>
